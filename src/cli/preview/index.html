<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Filled in by server.mjs from ALLOWED_PARENT_ORIGINS, which also sets `frame-ancestors`.
      const allowedDomains = __ALLOWED_PARENT_ORIGINS__
      const resizeIframe = (source) => {
        source.postMessage({ resizeHeight: this.document.body.clientHeight }, "*")
      }

      window.addEventListener("message", (message) => {
        if (message.source != window.parent || !allowedDomains.includes(message.origin)) {
          return
        }
        if (message.data.iframeEvaluation) {
          window.currentMessage = message
          eval.call(null, message.data.iframeEvaluation)
          delete window.currentMessage

          // Svg to img conversion to fit in the div
          const svgs = Array.from(this.document.getElementsByTagName("svg"))
          for (let i = 0; i < svgs.length; i++) {
            svgs[i].setAttribute("xmlns", "http://www.w3.org/2000/svg")
            var blob = new Blob([svgs[i].outerHTML], { type: "image/svg+xml" })
            var url = URL.createObjectURL(blob)
            var image = document.createElement("img")
            image.addEventListener("load", () => URL.revokeObjectURL(url), {
              once: true,
            })
            image.onload = () => resizeIframe(message.source)
            image.src = url
            svgs[i].parentNode.replaceChild(image, svgs[i])
          }

          resizeIframe(message.source)
        }

        if (message.data.theme) {
          const isDark = message.data.theme === "dark"
          isDark ? document.body.classList.add("dark") : document.body.classList.remove("dark")
        }
      })
    </script>
    <style>
      .rendered_html {
        width: 100%;
        color: #151515;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14px;
        /* any extras will just be numbers: */
        overflow-x: auto;
      }
      .dark .rendered_html {
        color: #cccccc;
      }
      .rendered_html em {
        font-style: italic;
      }
      .rendered_html strong {
        font-weight: bold;
      }
      .rendered_html u {
        text-decoration: underline;
      }
      .rendered_html :link {
        text-decoration: underline;
      }
      .rendered_html :visited {
        text-decoration: underline;
      }
      .rendered_html h1 {
        font-size: 185.7%;
        margin: 1.08em 0 0 0;
        font-weight: bold;
      }
      .rendered_html h2 {
        font-size: 157.1%;
        margin: 1.27em 0 0 0;
        font-weight: bold;
      }
      .rendered_html h3 {
        font-size: 128.6%;
        margin: 1.55em 0 0 0;
        font-weight: bold;
      }
      .rendered_html h4 {
        font-size: 100%;
        margin: 2em 0 0 0;
        font-weight: bold;
      }
      .rendered_html h5 {
        font-size: 100%;
        margin: 2em 0 0 0;
        font-weight: bold;
        font-style: italic;
      }
      .rendered_html h6 {
        font-size: 100%;
        margin: 2em 0 0 0;
        font-weight: bold;
        font-style: italic;
      }
      .rendered_html h1:first-child {
        margin-top: 0.538em;
      }
      .rendered_html h2:first-child {
        margin-top: 0.636em;
      }
      .rendered_html h3:first-child {
        margin-top: 0.777em;
      }
      .rendered_html h4:first-child {
        margin-top: 1em;
      }
      .rendered_html h5:first-child {
        margin-top: 1em;
      }
      .rendered_html h6:first-child {
        margin-top: 1em;
      }
      .rendered_html ul:not(.list-inline),
      .rendered_html ol:not(.list-inline) {
        padding-left: 2em;
      }
      .rendered_html ul {
        list-style: disc;
      }
      .rendered_html ul ul {
        list-style: square;
        margin-top: 0;
      }
      .rendered_html ul ul ul {
        list-style: circle;
      }
      .rendered_html ol {
        list-style: decimal;
      }
      .rendered_html ol ol {
        list-style: upper-alpha;
        margin-top: 0;
      }
      .rendered_html ol ol ol {
        list-style: lower-alpha;
      }
      .rendered_html ol ol ol ol {
        list-style: lower-roman;
      }
      .rendered_html ol ol ol ol ol {
        list-style: decimal;
      }
      .rendered_html * + ul {
        margin-top: 1em;
      }
      .rendered_html * + ol {
        margin-top: 1em;
      }
      .rendered_html hr {
        color: #151515;
      }
      .dark .rendered_html hr {
        color: #cccccc;
      }
      .rendered_html pre {
        margin: 1em 2em;
        padding: 0px;
        background-color: transparent;
        /* white-space: pre-wrap; */
      }
      .rendered_html code {
        background-color: #eff0f1;
      }
      .dark .rendered_html code {
        background-color: #151515;
      }
      .rendered_html p code {
        padding: 1px 5px;
      }
      .rendered_html pre code {
        background-color: transparent;
      }
      .rendered_html pre,
      .rendered_html code {
        border: 0;
        color: #151515;
        font-size: 100%;
      }
      .dark .rendered_html pre,
      .dark .rendered_html code {
        color: #cccccc;
      }
      .rendered_html blockquote {
        margin: 1em 2em;
      }
      .rendered_html table {
        margin-left: auto;
        margin-right: auto;
        border: none;
        border-collapse: collapse;
        border-spacing: 0;
        color: #151515;
        font-size: 12px;
        table-layout: fixed;
      }
      .dark .rendered_html table {
        color: #cccccc;
      }
      .rendered_html thead {
        border-bottom: 1px solid #111;
        vertical-align: bottom;
      }
      .rendered_html tr,
      .rendered_html th,
      .rendered_html td {
        text-align: right;
        vertical-align: middle;
        padding: 0.5em 0.5em;
        line-height: normal;
        white-space: normal;
        max-width: none;
        border: none;
      }
      .rendered_html th {
        font-weight: bold;
      }
      .rendered_html tbody tr:nth-child(odd) {
        background: #f5f5f5;
      }
      .dark .rendered_html tbody tr:nth-child(odd) {
        background: #2c2c2c;
      }
      .rendered_html tbody tr:hover {
        background: rgba(66, 165, 245, 0.2);
      }
      .dark .rendered_html tbody tr:hover {
        background: #2c2c2c;
        color: #cccccc;
      }
      .rendered_html * + table {
        margin-top: 1em;
      }
      .rendered_html p {
        text-align: left;
      }
      .rendered_html * + p {
        margin-top: 1em;
      }
      .rendered_html img {
        display: block;
        margin-left: auto;
        margin-right: auto;
      }
      .dark .rendered_html img {
        background-color: #fff;
      }
      .rendered_html * + img {
        margin-top: 1em;
      }
      .rendered_html iframe,
      .rendered_html img {
        max-width: 100% !important;
        object-fit: contain;
      }
      .rendered_html svg {
        object-fit: contain;
      }
      .rendered_html img.unconfined,
      .rendered_html svg.unconfined {
        max-width: none;
      }
      .rendered_html .alert {
        margin-bottom: initial;
      }
      .rendered_html * + .alert {
        margin-top: 1em;
      }
      .rendered_html code {
        font-family: monospace;
      }
    </style>
  </head>
  <body></body>
</html>
